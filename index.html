<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Calendar</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendar">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171C;
    --surface: #1E232B;
    --surface-2: #262C36;
    --text: #EDE6D6;
    --text-dim: #8B93A0;
    --border: #2E3540;

    --c-deemua: #D6A84A;
    --c-deebom: #4A8C82;
    --c-deezia: #C97B63;
    --c-deesor: #8FA872;
    --c-deekor: #9B8AA6;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 24px;
  }
  .app{ max-width: 480px; margin: 0 auto; padding: 20px 16px 8px; }

  .top{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 4px;
  }
  .top h1{
    font-family:'Fraunces', serif; font-weight:600; font-size: 20px; margin:0;
    letter-spacing: 0.2px;
  }
  .top .sub{ color: var(--text-dim); font-size: 12px; }

  /* cycle strip - the signature element: shows the 5-day rotation itself */
  .cycle-strip{
    display:flex; gap:6px; margin: 14px 0 18px;
    background: var(--surface); border:1px solid var(--border);
    border-radius: 14px; padding: 10px 10px;
  }
  .cycle-chip{
    flex:1; text-align:center; padding: 6px 2px; border-radius: 9px;
    font-size: 10.5px; font-weight:600; letter-spacing:0.3px;
    color: var(--text-dim); border: 1px solid transparent;
  }
  .cycle-chip.active{
    color: var(--bg); font-weight:700;
  }

  .nav{
    display:flex; align-items:center; justify-content:space-between;
    margin: 6px 0 14px;
  }
  .nav .month-label{
    font-family:'Fraunces', serif; font-size: 26px; font-weight:700;
  }
  .nav .month-label .yr{ color: var(--text-dim); font-weight:400; font-size: 18px; }
  .nav-btns{ display:flex; gap:8px; }
  .nav-btns button, .today-btn{
    width:40px; height:40px; border-radius: 12px;
    background: var(--surface-2); border:1px solid var(--border);
    color: var(--text); font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .nav-btns button:disabled{ opacity:0.3; }
  .nav-btns button:active, .today-btn:active{ background: var(--border); }

  .jump-row{ display:flex; gap:8px; margin-bottom: 18px; }
  .jump-row select{
    flex:1; background: var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius: 10px; padding: 9px 8px;
    font-family:'Inter'; font-size: 13px;
  }
  .today-btn{ width: auto; padding: 0 14px; font-size:13px; font-weight:600; font-family:'Inter'; }

  .weekday-row{ display:grid; grid-template-columns: repeat(7,1fr); margin-bottom:6px; }
  .weekday-row div{
    text-align:center; font-size: 11px; font-weight:600; color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .grid{ display:grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
  .cell{
    aspect-ratio: 1 / 1.04;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position: relative;
    padding-top: 2px;
  }
  .cell.pad{ background: transparent; border-color: transparent; }
  .cell.out-of-range{ opacity: 0.28; }
  .cell .num{
    font-family:'Fraunces', serif; font-weight:600; font-size: 16px; line-height:1;
  }
  .cell .native{
    font-size: 8.6px; font-weight:700; letter-spacing:0.3px; margin-top: 4px;
    text-transform: uppercase;
  }
  .cell.today{
    border-color: var(--text);
    box-shadow: 0 0 0 1px var(--text) inset;
  }
  .cell.today::after{
    content:''; position:absolute; top:6px; right:6px; width:5px; height:5px;
    border-radius:50%; background: var(--text);
  }

  .legend{
    display:flex; flex-wrap:wrap; gap: 8px 14px; margin-top: 20px;
    padding: 12px 14px; background: var(--surface); border:1px solid var(--border);
    border-radius: 12px;
  }
  .legend .item{ display:flex; align-items:center; gap:6px; font-size: 11.5px; color: var(--text-dim); }
  .legend .dot{ width:8px; height:8px; border-radius:50%; }

  .foot-note{ margin-top: 14px; font-size: 11px; color: var(--text-dim); text-align:center; line-height:1.5; padding: 0 8px;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>My Calendar</h1>
    <div class="sub" id="rangeLabel"></div>
  </div>

  <div class="cycle-strip" id="cycleStrip"></div>

  <div class="nav">
    <div class="month-label"><span id="monthName"></span> <span class="yr" id="yearName"></span></div>
    <div class="nav-btns">
      <button id="prevBtn" aria-label="Previous month">&#8592;</button>
      <button id="nextBtn" aria-label="Next month">&#8594;</button>
    </div>
  </div>

  <div class="jump-row">
    <select id="monthSelect"></select>
    <select id="yearSelect"></select>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>

  <div class="weekday-row" id="weekdayRow"></div>
  <div class="grid" id="grid"></div>

  <div class="legend" id="legend"></div>
  <div class="foot-note">Native day names rotate on a fixed 5-day cycle, independent of the 7-day week — so each name lands on a different weekday every time it comes around.</div>
</div>

<script>
  const NAMES = ['Deemua','Deebom','Deezia','Deesor','Deekor'];
  const COLORS = ['var(--c-deemua)','var(--c-deebom)','var(--c-deezia)','var(--c-deesor)','var(--c-deekor)'];
  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // Anchor for the 5-day cycle: Aug 28 2026 = Deemua (index 0).
  // Fixed so the rotation never shifts, no matter when the app is opened.
  const epoch = new Date(2026, 7, 28);

  let today = new Date();
  today.setHours(0,0,0,0);

  let minDate = new Date(today.getFullYear(), today.getMonth(), 1);
  let maxDate = new Date(today.getFullYear()+15, today.getMonth(), 1);

  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();

  // True as long as the user hasn't manually navigated away from "today".
  // While true, the view keeps following the current date automatically.
  let followingToday = true;
  let lastKnownDateStr = today.toDateString();

  function dayIndexFor(date){
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const diff = Math.round((d - epoch) / 86400000);
    return ((diff % 5) + 5) % 5;
  }

  function sameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  function buildCycleStrip(){
    const strip = document.getElementById('cycleStrip');
    strip.innerHTML = '';
    const todayIdx = dayIndexFor(today);
    NAMES.forEach((n,i)=>{
      const chip = document.createElement('div');
      chip.className = 'cycle-chip' + (i===todayIdx ? ' active' : '');
      chip.style.background = i===todayIdx ? COLORS[i] : 'transparent';
      chip.style.borderColor = COLORS[i];
      chip.textContent = n;
      strip.appendChild(chip);
    });
  }

  function buildWeekdayRow(){
    const row = document.getElementById('weekdayRow');
    row.innerHTML = '';
    WEEKDAYS.forEach(w=>{
      const d = document.createElement('div');
      d.textContent = w;
      row.appendChild(d);
    });
  }

  function buildLegend(){
    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    NAMES.forEach((n,i)=>{
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `<span class="dot" style="background:${COLORS[i]}"></span> ${n}`;
      legend.appendChild(item);
    });
  }

  function populateSelects(){
    const monthSel = document.getElementById('monthSelect');
    monthSel.innerHTML = MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');

    const yearSel = document.getElementById('yearSelect');
    const startY = today.getFullYear();
    const endY = today.getFullYear()+15;
    let opts = '';
    for(let y=startY; y<=endY; y++){ opts += `<option value="${y}">${y}</option>`; }
    yearSel.innerHTML = opts;

    monthSel.addEventListener('change', ()=>{
      viewMonth = parseInt(monthSel.value,10);
      clampView();
      render();
    });
    yearSel.addEventListener('change', ()=>{
      viewYear = parseInt(yearSel.value,10);
      clampView();
      render();
    });
  }

  function clampView(){
    const cur = new Date(viewYear, viewMonth, 1);
    if(cur < minDate){ viewYear = minDate.getFullYear(); viewMonth = minDate.getMonth(); }
    if(cur > maxDate){ viewYear = maxDate.getFullYear(); viewMonth = maxDate.getMonth(); }
  }

  function render(){
    document.getElementById('monthName').textContent = MONTHS[viewMonth];
    document.getElementById('yearName').textContent = viewYear;
    document.getElementById('monthSelect').value = viewMonth;
    document.getElementById('yearSelect').value = viewYear;

    const cur = new Date(viewYear, viewMonth, 1);
    document.getElementById('prevBtn').disabled = cur <= minDate;
    document.getElementById('nextBtn').disabled = cur >= maxDate;

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startOffset = firstOfMonth.getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    for(let i=0;i<startOffset;i++){
      const pad = document.createElement('div');
      pad.className = 'cell pad';
      grid.appendChild(pad);
    }

    for(let day=1; day<=daysInMonth; day++){
      const date = new Date(viewYear, viewMonth, day);
      const idx = dayIndexFor(date);
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(date < minDate || date >= new Date(maxDate.getFullYear(), maxDate.getMonth()+1, 0)) {
        // outside 15yr window edge case, harmless guard
      }
      if(sameDay(date, today)) cell.classList.add('today');
      cell.innerHTML = `<div class="num">${day}</div><div class="native" style="color:${COLORS[idx]}">${NAMES[idx]}</div>`;
      grid.appendChild(cell);
    }
  }

  function updateRangeLabel(){
    document.getElementById('rangeLabel').textContent =
      `${MONTHS[today.getMonth()].slice(0,3)} ${today.getFullYear()} – ${MONTHS[today.getMonth()].slice(0,3)} ${today.getFullYear()+15}`;
  }

  // Called whenever the real-world date has moved on (midnight rollover,
  // or the app regaining focus on a later day). Keeps "today" accurate
  // and, if the user hasn't navigated elsewhere, keeps the visible month in sync.
  function handleDateChange(){
    const now = new Date();
    now.setHours(0,0,0,0);
    if(now.toDateString() === lastKnownDateStr) return;

    const wasOnTodayMonth = (viewYear === today.getFullYear() && viewMonth === today.getMonth());

    today = now;
    lastKnownDateStr = today.toDateString();
    minDate = new Date(today.getFullYear(), today.getMonth(), 1);
    maxDate = new Date(today.getFullYear()+15, today.getMonth(), 1);

    populateSelects();
    buildCycleStrip();
    updateRangeLabel();

    if(followingToday || wasOnTodayMonth){
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();
    }
    clampView();
    render();
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    followingToday = false;
    viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; }
    clampView(); render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    followingToday = false;
    viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; }
    clampView(); render();
  });
  document.getElementById('monthSelect').addEventListener('change', ()=>{ followingToday = false; });
  document.getElementById('yearSelect').addEventListener('change', ()=>{ followingToday = false; });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    followingToday = true;
    viewYear = today.getFullYear(); viewMonth = today.getMonth();
    render();
  });

  // Catch day rollovers: on a timer, and whenever the app becomes visible
  // again (e.g. reopened from the home screen the next day).
  setInterval(handleDateChange, 60 * 1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') handleDateChange();
  });
  window.addEventListener('focus', handleDateChange);

  updateRangeLabel();
  buildCycleStrip();
  buildWeekdayRow();
  buildLegend();
  populateSelects();
  render();
</script>
</body>
</html>
