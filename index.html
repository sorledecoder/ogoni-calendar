<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ogoni Native Calendar</title>
<meta name="description" content="30-year native day calendar that works offline">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="calendar.ico" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --plum:#2a1740;--plum2:#3d2360;--orange:#f28a2e;--ink:#26222e;--paper:#fbf8f4;--card:#fff;--line:#e6dfd6;--muted:#7a7085;
  --d0:#f28a2e;--d1:#7b4bd1;--d2:#16a39a;--d3:#d64f7d;--d4:#5a8f2e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:760px;margin:auto;min-height:100vh;background:var(--paper)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.app-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--plum);color:#fff;position:sticky;top:0;z-index:5}
.app-logo{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff}
.brand{flex:1;min-width:0}
.app-header h1{font-size:1.2rem;font-weight:800;letter-spacing:.3px}
#status{font-size:.75rem;opacity:.8}
.install-button{border:0;background:var(--orange);color:#2a1740;font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer}
.install-button[hidden]{display:none}

.hero{margin:14px;padding:18px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--plum),var(--plum2));border-left:8px solid var(--hc,var(--orange))}
.hero-day{font-size:2.4rem;font-weight:900;line-height:1.1}
.hero-date{margin-top:4px;font-size:1rem;opacity:.9}
.hero-next{margin-top:10px;font-size:.82rem;opacity:.75;line-height:1.5}

.controls{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;padding:0 14px}
.nav,select{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:1rem}
.nav{font-size:1.6rem;line-height:1;cursor:pointer;color:var(--plum2)}
.tools{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:999px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.jump input{border:0;background:transparent;font-size:.85rem}

.legend{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto}
.chip{border:2px solid var(--c);background:transparent;color:var(--ink);padding:6px 11px;border-radius:999px;font-size:.78rem;font-weight:800;white-space:nowrap;cursor:pointer}
.chip[aria-pressed=true]{background:var(--c);color:#fff}

.calendar{padding:14px}
.month{text-align:center;font-size:1.3rem;font-weight:800;margin:0 0 10px}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekdays div{text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);padding:5px 0}
.day{min-height:72px;border:1px solid var(--line);border-top:4px solid var(--c,var(--line));border-radius:10px;padding:5px 2px;background:var(--card);cursor:pointer;text-align:center;position:relative}
.day.empty{background:transparent;border-color:transparent;cursor:default}
.day.out{visibility:hidden}
.num{font-size:1.05rem;font-weight:800}
.native{margin-top:5px;font-size:.62rem;font-weight:800;color:var(--c)}
.day.dim{opacity:.28}
.day.has-note::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.day.today{background:var(--c);border-color:var(--c)}
.day.today .num,.day.today .native{color:#fff}
.day.sel{outline:3px solid var(--orange)}

.note{margin:4px 14px 14px;padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:.82rem;line-height:1.55;color:var(--muted)}
footer{text-align:center;padding:16px;font-size:.75rem;color:var(--muted)}

.sheet{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border-top:8px solid var(--c);position:relative;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-card h3{font-size:1.5rem;color:var(--c)}
.sheet-card p{margin:4px 0 14px;color:var(--muted);font-size:.9rem;line-height:1.5}
.sheet-card label{font-size:.8rem;font-weight:700}
textarea{width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);resize:vertical}
.save{margin-top:10px;width:100%;border:0;border-radius:12px;padding:13px;background:var(--plum);color:#fff;font-weight:800;cursor:pointer}
.close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.8rem;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--plum);color:#fff;padding:11px 16px;border-radius:12px;font-size:.85rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.toast.show{opacity:1}
@media(max-width:420px){.day{min-height:62px}.native{font-size:.55rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* month-first layout */
.app-header{padding:10px 14px}.app-logo{width:38px;height:38px}.app-header h1{font-size:1.05rem}
.controls{padding-top:10px}
.calendar{padding:10px 14px 4px}.month{font-size:1.15rem;margin-bottom:8px}
.day{min-height:66px;padding:4px 2px}
.num{font-size:1.1rem;font-weight:800;color:var(--ink)}
.native{margin:4px 2px 0;padding:3px 0;font-size:.62rem;font-weight:800;line-height:1.1;color:#fff;background:var(--c);border-radius:6px}
.day.today{box-shadow:0 0 0 3px var(--orange)}
.day.today .num{color:#fff}.day.today .native{background:#0005}
.hero{margin:8px 14px;padding:12px 14px;border-radius:14px;display:block}
.hero-day{font-size:1.5rem}.hero-date{font-size:.9rem;margin-top:2px}.hero-next{display:block;margin-top:6px;font-size:.78rem}
@media(max-width:420px){.day{min-height:62px}.native{font-size:.56rem}}


/* black and white theme */
:root{--plum:#000;--plum2:#111;--orange:#000;--ink:#000;--paper:#fff;--card:#fff;--line:#bdbdbd;--muted:#444}
.install-button{background:#fff;color:#000}
.hero{background:#000;border-left:8px solid #fff}
.day.today{background:#000;box-shadow:0 0 0 3px #000}
.day.today .num,.day.today .native{color:#fff}
.day.today .native{background:#fff;color:#000}
.nav{color:#000}
.chip{border-color:#000}
.sheet-card h3{color:#000}
.close{color:#000}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <img class="app-logo" src="icon-192.png" alt="" width="38" height="38">
    <div class="brand"><h1>Native Calendar</h1><p id="status">Offline ready</p></div>
    <button id="install-btn" class="install-button" hidden>Install app</button>
  </header>
  <nav class="controls" aria-label="Month navigation">
    <button class="nav" id="prev" aria-label="Previous month">‹</button>
    <select id="month" aria-label="Choose month"></select>
    <button class="nav" id="next" aria-label="Next month">›</button>
  </nav>
  <main class="calendar">
    <h2 id="title" class="month"></h2>
    <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div id="days" class="days"></div>
  </main>
  <section class="hero" aria-live="polite">
    <div class="hero-day" id="heroNative">—</div>
    <div class="hero-date" id="heroDate"></div>
    <div class="hero-next" id="heroNext"></div>
  </section>
  <div class="tools">
    <button id="todayBtn" class="pill">Today</button>
    <label class="pill jump">Jump to date <input type="date" id="jump"></label>
  </div>
  <div class="legend" id="legend" role="group" aria-label="Highlight a native day"></div>
  <p class="note">Rotation: Deemua → Deebom → Deezia → Deesor → Deekor, then repeat. Friday 28 August 2026 is Deemua. Tap a day to see details and keep a note.</p>
  <footer>Native Calendar · works offline · no account needed</footer>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <button class="close" id="sheetClose" aria-label="Close">×</button>
    <h3 id="sTitle"></h3><p id="sSub"></p>
    <label for="sNote">Note for this day</label>
    <textarea id="sNote" rows="4" placeholder="Write a reminder. It stays on this device."></textarea>
    <button class="save" id="sSave">Save note</button>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
(function(){
// install.js — Install button (Android/Chrome/Edge), iOS hint, service worker + update prompt.
let deferredPrompt = null;
const $ = (id) => document.getElementById(id);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const showInstall = (on) => { const b = $('install-btn'); if (b) b.hidden = !on; };
const say = (m, ms) => (window.toast ? window.toast(m, ms) : alert(m));

addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  if (!isStandalone()) showInstall(true);
});
addEventListener('appinstalled', () => { deferredPrompt = null; showInstall(false); say('Calendar installed'); });

addEventListener('DOMContentLoaded', () => {
  const btn = $('install-btn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null; showInstall(false);
    } else if (isIOS()) {
      say('Tap Share, then "Add to Home Screen"', 7000);
    } else {
      say('Open the browser menu (⋮) and tap "Install app". The page must be on https.', 8000);
    }
  });
  showInstall(!isStandalone());
});

if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w && w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            say('Update ready. Reopen the app to apply it.', 6000);
            w.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch((err) => console.error('Service worker failed:', err));
  });
}

})();
</script>
<script>
const START = new Date(2026, 7, 28), END = new Date(2056, 7, 27);
const NAMES = ['Deemua', 'Deebom', 'Deezia', 'Deesor', 'Deekor'];
const COLORS = ['#000', '#000', '#000', '#000', '#000'];
const $ = (id) => document.getElementById(id);
const day0 = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const key = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const diff = (a, b) => Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5);
const idx = (d) => ((diff(d, START) % 5) + 5) % 5;
const inRange = (d) => d >= START && d <= END;
const clampMonth = (d) => { const f = new Date(d.getFullYear(), d.getMonth(), 1); const lo = new Date(2026, 7, 1), hi = new Date(2056, 7, 1); return f < lo ? lo : f > hi ? hi : f; };
const fmt = (d, o) => d.toLocaleDateString(undefined, o);

let current = clampMonth(new Date()), filter = -1, selected = null, notes = {};
try { notes = JSON.parse(localStorage.getItem('ogoni-notes') || '{}'); } catch (e) {}
const saveNotes = () => { try { localStorage.setItem('ogoni-notes', JSON.stringify(notes)); } catch (e) {} };

window.toast = (m, ms = 3000) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); };

function setup() {
  const s = $('month');
  for (let d = new Date(2026, 7, 1); d <= new Date(2056, 7, 1); d.setMonth(d.getMonth() + 1)) {
    const o = document.createElement('option');
    o.value = d.getFullYear() + '-' + d.getMonth();
    o.textContent = fmt(d, { month: 'long', year: 'numeric' });
    s.appendChild(o);
  }
  $('legend').innerHTML = NAMES.map((n, i) => `<button class="chip" style="--c:${COLORS[i]}" data-i="${i}" aria-pressed="false">${n}</button>`).join('');
  $('legend').onclick = (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const i = +b.dataset.i; filter = filter === i ? -1 : i;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(+c.dataset.i === filter)));
    render();
  };
  $('prev').onclick = () => move(-1); $('next').onclick = () => move(1);
  $('month').onchange = () => { const [y, m] = $('month').value.split('-').map(Number); current = new Date(y, m, 1); render(); };
  $('todayBtn').onclick = goToday;
  $('jump').min = key(START); $('jump').max = key(END);
  $('jump').onchange = (e) => { if (!e.target.value) return; const [y, m, d] = e.target.value.split('-').map(Number); current = new Date(y, m - 1, 1); render(); openSheet(new Date(y, m - 1, d)); };
  $('sheetClose').onclick = closeSheet;
  $('sheet').onclick = (e) => { if (e.target.id === 'sheet') closeSheet(); };
  $('sSave').onclick = () => { const k = key(selected), v = $('sNote').value.trim(); if (v) notes[k] = v; else delete notes[k]; saveNotes(); closeSheet(); render(); toast(v ? 'Note saved' : 'Note removed'); };
  $('days').onclick = (e) => { const c = e.target.closest('.day[data-d]'); if (c) { const [y, m, d] = c.dataset.d.split('-').map(Number); openSheet(new Date(y, m - 1, d)); } };

  let x0 = null;
  const cal = document.querySelector('.calendar');
  cal.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  cal.addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) move(dx < 0 ? 1 : -1); x0 = null; });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); if ($('sheet').hidden && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1); } });
  const net = () => { $('status').textContent = navigator.onLine ? 'Offline ready' : 'You are offline. The calendar still works.'; };
  addEventListener('online', net); addEventListener('offline', net); net();
}

function move(x) { const n = new Date(current.getFullYear(), current.getMonth() + x, 1); if (n >= new Date(2026, 7, 1) && n <= new Date(2056, 7, 1)) { current = n; render(); } }
function goToday() { current = clampMonth(new Date()); render(); }

function hero() {
  const t = day0(new Date());
  if (!inRange(t)) {
    $('heroNative').textContent = t < START ? 'Starts 28 Aug 2026' : 'Ended 27 Aug 2056';
    $('heroDate').textContent = fmt(t, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('heroNext').textContent = 'The calendar covers 28 Aug 2026 to 27 Aug 2056.'; return;
  }
  const i = idx(t);
  $('heroNative').textContent = NAMES[i];
  document.querySelector('.hero').style.setProperty('--hc', COLORS[i]);
  $('heroDate').textContent = fmt(t, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('heroNext').textContent = 'Tomorrow is ' + NAMES[(i + 1) % 5] + '. Next ' + NAMES[0] + ' in ' + (((5 - i) % 5) || 5) + (((5 - i) % 5) === 1 ? ' day.' : ' days.');
}

function render() {
  hero();
  $('title').textContent = fmt(current, { month: 'long', year: 'numeric' });
  const g = $('days'); g.innerHTML = '';
  const off = current.getDay(), total = new Date(current.getFullYear(), current.getMonth() + 1, 0).getDate(), now = day0(new Date());
  let h = '';
  for (let i = 0; i < off; i++) h += '<div class="day empty"></div>';
  for (let n = 1; n <= total; n++) {
    const d = new Date(current.getFullYear(), current.getMonth(), n);
    if (!inRange(d)) { h += '<div class="day empty out"></div>'; continue; }
    const i = idx(d), k = key(d);
    const cls = ['day', d.getTime() === now.getTime() ? 'today' : '', notes[k] ? 'has-note' : '', filter >= 0 && filter !== i ? 'dim' : ''].join(' ');
    h += `<div class="${cls}" style="--c:${COLORS[i]}" data-d="${k}" role="button" tabindex="0" aria-label="${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}, ${NAMES[i]}"><div class="num">${n}</div><div class="native">${NAMES[i]}</div></div>`;
  }
  g.innerHTML = h;
  $('month').value = current.getFullYear() + '-' + current.getMonth();
}

function openSheet(d) {
  if (!inRange(d)) { toast('That date is outside the 30-year range'); return; }
  selected = d; const i = idx(d), t = day0(new Date()), dd = diff(d, t);
  $('sheet').querySelector('.sheet-card').style.setProperty('--c', COLORS[i]);
  $('sTitle').textContent = NAMES[i];
  $('sSub').textContent = fmt(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + (dd === 0 ? ' · Today' : dd > 0 ? ` · In ${dd} day${dd > 1 ? 's' : ''}` : ` · ${-dd} day${dd < -1 ? 's' : ''} ago`);
  $('sNote').value = notes[key(d)] || '';
  $('sheet').hidden = false; $('sNote').focus();
}
function closeSheet() { $('sheet').hidden = true; }

// Auto date: refresh at midnight, on focus, and every minute
let lastDay = key(new Date());
function auto() { const k = key(new Date()); if (k !== lastDay) { lastDay = k; goToday(); } else hero(); }
setInterval(auto, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) auto(); });

setup();
if (new URLSearchParams(location.search).get('go') === 'today') goToday(); else render();

</script>
</body>
</html>
